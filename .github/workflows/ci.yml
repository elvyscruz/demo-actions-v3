name : Enviar noficicacion al hacer push

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: clonar codigo
        uses: actions/checkout@v4

      - name: instalar nodejs
        uses: actions/setup-node@v4
        with: 
          node-version: 22
      - name: instalar depedencia
        run: npm ci

      - name: ejecutar pruebas unitarias
        run: npm test 

      - name: Enviar notificación a ntfy
        if: always()
        run: |
          curl \
            -H "Title: GitHub Actions - Hola Mundo" \
            -H "Priority: default" \
            -d "El workflow terminó con estado: ${{ job.status }}" \
            https://ntfy.sh/devops-itla
